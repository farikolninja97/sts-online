/* V1.06 — per-hit cinematic combat feedback. Overlay never captures taps or drags. */
#ember-vfx-layer{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden;contain:layout style}
.vfx-impact,.vfx-number,.vfx-death,.vfx-burst,.vfx-spark,.vfx-block{position:fixed;pointer-events:none;user-select:none;-webkit-user-select:none}
.vfx-impact{width:110px;height:110px;transform:translate(-50%,-50%);z-index:4;isolation:isolate;animation:vfx-hit-pop .35s ease-out both}
.vfx-impact:before,.vfx-impact:after{content:"";position:absolute;inset:0;pointer-events:none}
.vfx-impact.slash:before,.vfx-impact.multi:before{left:47%;top:4%;width:11%;height:94%;inset:auto;background:linear-gradient(90deg,#fff7dc,#ffe2a8 28%,#f47145 72%,transparent);border-radius:70% 3px 70% 3px;transform:rotate(42deg);filter:drop-shadow(0 0 8px #ffc37b);animation:vfx-slice .32s cubic-bezier(.12,.68,.18,1) both}
.vfx-impact.slash:after,.vfx-impact.multi:after{left:19%;top:47%;width:75%;height:6%;inset:auto;transform:rotate(-39deg);background:#ffecc6b9;box-shadow:0 0 15px #ffd26e;animation:vfx-cross .31s both}
.vfx-impact.multi{transform:translate(-50%,-50%) scale(.73)}
.vfx-impact.heavy:before{inset:13%;border:7px solid #ffdc91;border-radius:50%;box-shadow:0 0 24px #ff7a3c,inset 0 0 20px #f38d45;animation:vfx-ring .41s ease-out both}
.vfx-impact.heavy:after{inset:23%;background:radial-gradient(circle,#fff4d9,#f5a34f 46%,transparent 75%);filter:blur(3px);animation:vfx-bang .35s both}
.vfx-impact.ember:before{inset:11%;border-radius:44% 56% 57% 43%;background:radial-gradient(circle at 50% 65%,#fff9cf 5%,#ffbc55 23%,#e64a29a8 48%,transparent 75%);filter:blur(2px);animation:vfx-fire .44s both}
.vfx-impact.enemy:before{inset:9%;border-radius:50%;border:5px solid #fa8377;box-shadow:0 0 27px #ff4f558a;animation:vfx-ring .4s both}
.vfx-impact.enemy:after{left:46%;top:6%;height:90%;width:10px;inset:auto;border-radius:20px;transform:rotate(-28deg);background:#ffe3be;box-shadow:0 0 14px #ff6262;animation:vfx-slice .32s both}
.vfx-number{z-index:7;transform:translate(-50%,-50%);font:1000 clamp(20px,4vw,39px)/1 system-ui,sans-serif;color:#fff0cd;text-shadow:0 3px 0 #69251f,0 5px 10px #000,0 0 13px #fb693b;animation:vfx-number-rise .78s ease-out both;white-space:nowrap}
.vfx-number.blocked{color:#b7eaff;font-size:clamp(16px,3vw,27px);text-shadow:0 2px 8px #143954,0 4px 6px #000}
.vfx-number.heal{color:#a7f7b9;text-shadow:0 2px 8px #11582a,0 4px 6px #000}
.vfx-block{z-index:6;width:70px;height:70px;border:4px solid #94d5ff;background:radial-gradient(circle,#88bcf995,#4c769988 42%,transparent 67%);border-radius:32% 32% 45% 45%;transform:translate(-50%,-50%);animation:vfx-shield .4s ease-out both;box-shadow:0 0 19px #7bcaff96}
.vfx-block:before{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#e9faff;font-size:31px}
.vfx-death{z-index:5;transform-origin:center 80%;filter:drop-shadow(0 8px 10px #0009);animation:vfx-enemy-death .88s cubic-bezier(.2,.1,.5,1) both}
.vfx-death .avatar{width:100%;height:100%;max-height:none;animation:none!important;opacity:1}
.vfx-death svg{width:100%;height:100%;animation:none!important;filter:drop-shadow(0 0 9px #ffb262)}
.vfx-spark{z-index:6;width:var(--size,5px);height:var(--size,5px);border-radius:50% 20% 50% 20%;background:var(--spark,#ffbb61);box-shadow:0 0 9px #ffbe6e;animation:vfx-ember-drift var(--dur,.78s) ease-out both;transform:translate(-50%,-50%)}
.vfx-burst{z-index:5;width:100px;height:100px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffdc946e 0,#e78a3e55 31%,transparent 73%);animation:vfx-ring .53s both}
body.vfx-shake .arena{animation:vfx-arena-jolt .27s ease-out both}
@keyframes vfx-hit-pop{0%{opacity:0;scale:.35}35%{opacity:1;scale:1.1}100%{opacity:0;scale:1.45}}
@keyframes vfx-slice{0%{opacity:0;scale:.1}30%{opacity:1;scale:1.2}100%{opacity:0;scale:1.35}}
@keyframes vfx-cross{0%{opacity:0;scale:.2}35%{opacity:1;scale:1.1}100%{opacity:0;scale:1.3}}
@keyframes vfx-ring{0%{opacity:0;scale:.4}28%{opacity:1;scale:1}100%{opacity:0;scale:2.1}}
@keyframes vfx-bang{0%{opacity:0;scale:.25}25%{opacity:1;scale:1}100%{opacity:0;scale:1.4}}
@keyframes vfx-fire{0%{opacity:0;scale:.1;transform:translateY(14px)}32%{opacity:1;scale:1}100%{opacity:0;scale:1.7;transform:translateY(-24px)}}
@keyframes vfx-number-rise{0%{opacity:0;translate:0 15px;scale:.5}25%{opacity:1;translate:0 -8px;scale:1.2}70%{opacity:1;scale:1}100%{opacity:0;translate:0 -64px;scale:.87}}
@keyframes vfx-shield{0%{opacity:0;scale:.3}35%{opacity:1;scale:1.1}100%{opacity:0;scale:1.55}}

function spec(c){let d=CARDS[c.key];return c.up&&UP[c.key]?{...d,...UP[c.key]}:d}
function updatedText(c){return spec(c).desc}
function updatedCost(c){let d=spec(c);return c.tempFree?0:(d.cost<0?d.cost:d.cost+(d.type==='Attack'&&S?.screen==='battle'?(S.tangled||0):0))}
function cardText(c){return updatedText(c)}
function getCost(c){return updatedCost(c)}
function cardHTML(c,mode='hand'){
 let d=spec(c), cost=updatedCost(c), playable=mode!=='hand'||(S&&S.screen==='battle'&&!busy&&!d.unplayable&&(cost===-1||S.energy>=cost));
 let action=mode==='hand'?'play':mode==='reward'?'rewardcard':'inspectcard';
 const live=(mode==='hand'||mode==='combat-inspect')&&S?.screen==='battle'&&d.type==='Attack'?damagePreview(c,targetEnemy()):null;
 const liveLabel=live?` · ${live.perHit} damage${live.hits>1?' × '+live.hits:''} vs ${live.enemyName}`:'';
 const badge=live?`<div class="v109-damage" role="note" aria-label="${escapeHTML(live.accessible)}" title="${escapeHTML(live.accessible)}"><b>⚔ ${live.perHit}</b>${live.hits>1?`<em>×${live.hits}</em>`:''}<small>${live.random?'RANDOM':live.hpLoss!==live.total?`${live.hpLoss} HP`:'LIVE'}</small></div>`:'';
 return `<button class="card type-${d.type.toLowerCase()} ${!playable?'disabled':''} ${mode!=='hand'?'mini':''}" ${!playable&&mode!=='hand'?'disabled':''} data-playable="${playable}" data-${action}="${escapeHTML(c.uid)}" aria-label="${escapeHTML(d.name+(c.up?' upgraded':'')+', '+d.desc+liveLabel)}"><span class="cost">${d.unplayable?'—':cost===-1?'X':cost}</span><div class="card-title">${escapeHTML(d.name)}${c.up?'+':''}</div><div class="art">${iconArt(d.icon)}${badge}</div><div class="card-type">${d.type}</div><div class="card-desc">${live?liveCardDescription(d.desc,live):escapeHTML(d.desc)}</div><div class="rarity">${d.rarity}</div></button>`;
}
function log(t){S.log.unshift(t); S.log=S.log.slice(0,22)}
const alive=()=>S.enemies.filter(e=>e.hp>0);
const targetEnemy=()=>S.enemies[S.target]?.hp>0?S.enemies[S.target]:alive()[0];
const moveFor=(e)=>{
 if(e.stunned){return {n:'Stunned',kind:'sleep',stunned:true}}
 if(e.key==='sentinel')return e.step===0?ENEMIES.sentinel.moves[0]:e.step===1?ENEMIES.sentinel.moves[1]:ENEMIES.sentinel.moves[2];
 if(e.key==='feeder')return e.step===0?ENEMIES.feeder.moves[0]:e.step===1?ENEMIES.feeder.moves[1]:ENEMIES.feeder.moves[2];
 if(e.key==='acolyte')return e.step===0?ENEMIES.acolyte.moves[0]:ENEMIES.acolyte.moves[1];
 if(e.key==='stone')return ENEMIES.stone.moves[0];
 return ENEMIES[e.key].moves[e.step%ENEMIES[e.key].moves.length];
};
const legacyAdjustedEnemyDamage=(e,m)=>{
 let base=S.asc9&&m.ascDmg!=null?m.ascDmg:(m.dmg||0);
 // Ascension 9+ differences are documented for a subset; the remaining demo encounters are normal-only.
 if(S.asc9&&!m.ascDmg){const over={mite:{Chomp:8,Stomp:14},marauder:{Crush:8},axe:{'Guarded Swing':6,'Overhead Smash':13},vine:{'Vine Swipe':7,Grasp:9,Gorge:18},archer:{'Piercing Bolt':16},acolyte:{'Dark Strike':11},whelp:{Bite:8},silk:{Thrash:5},stone:{Headbutt:16},feeder:{'Absorb Heat':0}};base=over[e.key]?.[m.n]??base;}
 let value=Math.max(0,base+(e.strength||0));
 if(e.weak>0)value=Math.floor(value*.75);
 if(S.vulnerable>0)value=Math.floor(value*1.5);
 return value;
};
function intentHTML(e){const m=moveFor(e);let hits=m.hits||1,damage=adjustedEnemyDamage(e,m);return m.kind==='attack'?`<span class="danger">⚔ ${damage}${hits>1?' × '+hits:''}</span><span class="move-name">${escapeHTML(m.n)}</span>`:`<span class="support">${m.kind==='buff'?'✦ ':m.kind==='debuff'?'☷ ':'◌ '}${escapeHTML(m.n)}${m.strength?' +'+(S.asc9&&e.key==='feeder'?16:m.strength)+' Str':''}</span>`}

function introScreen(){return `<main class="page opening"><section><div class="ribbon">An original animated browser roguelike</div><h1 class="hero-title">Ember<br><i>Descent</i></h1><p class="intro">Command the <b>Ironclad</b> in a compact, playable deckbuilding adventure. Each creature has an original name and sprite, with combat rhythms adapted from Slay the Spire 2 encounter references.</p><div class="features"><span class="chip">⚔ Animated turn-based combat</span><span class="chip">♣ ${POOL.length+3} implemented Ironclad cards</span><span class="chip">✧ Strength-aware intents</span><span class="chip">♜ Three acts</span></div><div class="btnrow"><button class="btn primary" data-action="new">Begin a run</button><button class="btn dark" data-action="how">How to play</button></div><p class="note" style="margin-top:20px">Standalone fan prototype with new creature illustrations—not an official Slay the Spire 2 port. Saves locally. <span class="version">${VERSION}</span></p></section><div class="scene-hero">${sprite('hero')}</div></main>`}

og" aria-live="polite">${S.log.slice(0,2).map(l=>`<div>${escapeHTML(l)}</div>`).join('')}</div><div class="hand-wrap">${S.hand.length?S.hand.map(c=>cardHTML(c)).join(''):'<span class="subhead">Your hand is empty — end the turn.</span>'}</div></main>`}

 if(S.tempStrength){S.strength-=S.tempStrength;S.tempStrength=0}
 S.rage=0;S.oneTwo=0; // Turn-only effects expire at the end of the player's turn.
 if(checkEndBattle()){save();render();return}
 await legacyEndTurn();
 if(S.screen!=='battle'){save();render();return}
 S.exhaustedThisTurn=0;S.turnHpLoss=0;S.blockGainedFromCard=false;for(let pile of [S.draw,S.discard,S.hand,S.exhaust])for(let card of pile)card.tempFree=false;
 if(S.powers?.pyre)S.energy+=S.powers.pyre;
 if(S.powers?.crimson){personalLoss(S.powers.crimson);gainBlock(S.crimsonBlock||7*S.powers.crimson)}
 if(S.powers?.inferno)personalLoss(S.powers.inferno);
 if(S.powers?.aggression){for(let i=0;i<S.powers.aggression;i++){let cs=S.discard.filter(c=>spec(c).type==='Attack');if(cs.length&&S.hand.length<10){let c=choice(cs);S.discard.splice(S.discard.indexOf(c),1);if(UP[c.key])c.up=true;S.hand.push(c)}}}
 
 for(let e of S.enemies){if(e.tempStrengthDown){e.strength+=e.tempStrengthDown;e.tempStrengthDown=0}}
 S.colossus=0;
 if(S.hp<=0)S.screen='death';save();render();triggerFX()
}

 if(q.source==='hero')vfxAnimateActor('hero','attack');
 if(hurt>0){vfxAnimateActor(q.id,'hurt')}
 if(blocked>0){let shield=vfxElement('vfx-block',x,y);vfxRemove(shield,430)}
 if(hurt>0||(!blocked&&q.incoming>0)){
  let impact=vfxElement('vfx-impact '+style,x,y);vfxRemove(impact,500);
  vfxSparks(x,y,style==='heavy'?12:style==='ember'?10:6,style==='heavy');
 }
 let number=vfxElement('vfx-number'+(hurt===0?' blocked':''),x,y-28);
 number.textContent=hurt>0?'−'+hurt:(blocked>0?'BLOCKED':'0');vfxRemove(number,840);
 if(blocked>0&&hurt>0){let guard=vfxElement('vfx-number blocked',x+30,y+8);guard.textContent='🛡 '+blocked;vfxRemove(guard,850)}
 if(hurt>0&&(style==='heavy'||q.id==='hero')){
  document.body.classList.remove('vfx-shake');void document.body.offsetWidth;
  document.body.classList.add('vfx-shake');setTimeout(()=>document.body.classList.remove('vfx-shake'),280);
 }
}
function vfxDeath(q){
 const v=q.visual;if(!v)return;
 const ghost=vfxElement('vfx-death',v.x,v.y);
 ghost.style.width=Math.max(v.w,38)+'px';ghost.style.height=Math.max(v.h,42)+'px';
 ghost.innerHTML=v.avatarHTML;
 // During a last-enemy kill, the battle screen is intentionally held for this animation.
 const original=document.querySelector(vfxSelector(q.id));
 if(original)original.style.visibility='hidden';
 vfxSparks(v.cx,v.cy,21,true);
 const bloom=vfxElement('vfx-burst',v.cx,v.cy);vfxRemove(bloom,550);
 vfxRemove(ghost,vfxReduced?190:900);
}
triggerFX=function(){
 let jobs=fx.splice(0);if(!jobs.length)return;
 let now=performance.now();
 // Keep multi-hit visuals spaced apart even though combat outcomes resolve synchronously.
 let offset=Math.max(0,vfxVisualEnd-now),previousId=null,lastHitAt=0;
 for(let q of jobs){
   if(q.type==='hit'){
     if(previousId===q.id){offset+=vfxReduced?35:156}
     else if(previousId!==null){offset+=vfxReduced?25:82}
     previousId=q.id;lastHitAt=offset;
   }else if(q.type==='death'){offset=Math.max(offset,lastHitAt+(vfxReduced?25:180));}
   setTimeout(()=>vfxImpact(q),Math.max(0,offset));
 }
 vfxVisualEnd=now+offset+(vfxReduced?55:180);
};
const vfxOriginalRender=render;
render=function(){
 // Don't cut away to a card reward before the final monster disintegrates.
 if(!vfxTransitionHeld&&S&&S.screen!=='battle'&&document.body.classList.contains('oncombat')&&fx.some(q=>q.type==='death')){
   vfxTransitionHeld=true;
   const remaining=Math.max(0,vfxVisualEnd-performance.now());
   const hits=fx.filter(q=>q.type==='hit').length;
   const otherDeaths=fx.filter(q=>q.type==='death').length-1;
   const hold=vfxReduced?190:Math.min(3200,Math.max(1100,remaining+950+Math.max(0,hits-1)*140+Math.max(0,otherDeaths)*150));
   setTimeout(()=>{vfxTransitionHeld=false;vfxOriginalRender()},hold);
   return;
 }
 if(vfxTransitionHeld)return;
 vfxOriginalRender();
};


/* V1.08 — swipeable hand, expanded card inspection, universal drag casting. */
let v108HandScroll=0;
const v108BattleScreen=battleScreen;
battleScreen=function(){
 const content=v108BattleScreen();
 const handToolbar=`<div class="hand-tools" role="group" aria-label="Hand navigation"><span class="hand-count">HAND <b>${S.hand.length}/10</b></span><button type="button" class="hand-nav" data-hand-scroll="-1" aria-label="Scroll hand left">‹</button><button type="button" class="hand-nav" data-hand-scroll="1" aria-label="Scroll hand right">›</button><button class="hand-view" data-action="handall">View all cards</button><span class="hand-hint">Swipe cards · Tap for live damage · Drag to play</span></div>`;
 return content.replace('<div class="hand-wrap">','<section class="hand-area">'+handToolbar+'<div class="hand-wrap" role="group" aria-label="Swipeable card hand">').replace('</div></main>','</div></section></main>');
};
const v108Render=render;
render=function(){
 if(S?.screen==='battle')v108HandScroll=document.querySelector('.hand-wrap')?.scrollLeft??v108HandScroll;
 v108Render();
 if(S?.screen==='battle')requestAnimationFrame(()=>{
   const row=document.querySelector('.hand-wrap');
   if(row){row.scrollLeft=Math.min(v108HandScroll,Math.max(0,row.scrollWidth-row.clientWidth));}
   document.querySelectorAll('.hand-wrap .card').forEach(c=>{c.style.marginLeft='0px';c.style.zIndex='1'});
 });
};
const v108ModalHTML=modalHTML;
modalHTML=function(){
 if(modal?.type==='handall'){
   return `<div class="overlay"><section class="modal v108-hand-modal" role="dialog" aria-modal="true" aria-label="All cards in hand"><button class="litebtn close" data-action="close" aria-label="Close">✕</button><h2>Cards in your hand (${S.hand.length}/10)</h2><p class="note">Choose any card to read its complete text and play it. Scroll inside this window to see all cards.</p><div class="v108-hand-list">${S.hand.map(c=>{let d=spec(c),cost=updatedCost(c);return `<button class="v108-hand-item" data-inspect-hand="${escapeHTML(c.uid)}"><span class="v108-hand-cost">${cost===-1?'X':cost}</span><span><b>${escapeHTML(d.name)}${c.up?'+':''}</b><small>${escapeHTML(d.type)} · ${escapeHTML(d.rarity)}</small><span class="v108-hand-desc">${S.screen==='battle'&&d.type==='Attack'?liveCardDescription(d.desc,damagePreview(c,targetEnemy())):escapeHTML(d.desc)}</span></span><span class="v108-hand-eye">⌕</span></button>`}).join('')||'<p class="note">Your hand is empty.</p>'}</div><button class="btn ghost" data-action="close">Return to battle</button></section></div>`;
 }
 if(modal?.type==='cardinspect'){
   let c=S?.hand?.find(x=>x.uid===modal.id);
   if(!c)return `<div class="overlay"><section class="modal"><h2>Card no longer in hand</h2><button class="btn" data-action="close">Close</button></section></div>`;
   let d=spec(c), cost=updatedCost(c), valid=!d.unplayable&&(cost===-1||cost<=S.energy),targeted=isTargetedCard(c);
   let cleanCard=cardHTML(c,'combat-inspect').replace(/\sdata-rewardcard="[^"]*"/g,'').replace(/<button /,'<div ').replace(/<\/button>/,'</div>');
   return `<div class="overlay"><section class="modal v108-inspect-modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(d.name)} details"><button class="litebtn close" data-action="inspectclose" aria-label="Close">✕</button><p class="small">CARD DETAILS · ${escapeHTML(d.type.toUpperCase())}</p><div class="v108-inspect-layout"><div class="v108-inspect-art">${cleanCard}</div><div class="v108-inspect-info"><h2>${escapeHTML(d.name)}${c.up?'+':''}</h2><p class="v108-card-text">${escapeHTML(d.desc)}</p>${d.type==='Attack'?damageBreakdownHTML(c):''}<p class="note">${cost===-1?'X':cost} Energy · ${escapeHTML(d.rarity)}${c.up?' · Upgraded':''}</p><p class="note">${targeted?'Select a foe below to update the live damage, then tap Select enemy or drag the card.':'Drag this card onto the battlefield to activate it.'}</p><div class="v108-inspect-actions"><button class="btn primary" data-action="${targeted?'inspectaim':'inspectplay'}" ${valid?'':'disabled'}>${targeted?'Select enemy →':d.type==='Power'?'Activate Power ✦':'Play card ⬡'}</button><button class="btn ghost" data-action="inspectclose">Back</button></div>${valid?'':`<p class="note">${d.unplayable?'This card cannot be played directly.':'Not enough Energy to play this card.'}</p>`}</div></div></section></div>`;
 }
 return v108ModalHTML();
};
const v108Act=act;
act=function(action){
 if(action==='handall'){modal={type:'handall'};render();return}
 if(action==='inspectclose'){modal=modal?.from==='handall'?{type:'handall'}:null;render();return}
 if(action==='inspectplay'||action==='inspectaim'){
   let c=S?.hand?.find(x=>x.uid===modal?.id);
   if(!c){modal=null;render();return}
   let d=spec(c), cost=updatedCost(c);
   if(d.unplayable||(cost!==-1&&cost>S.energy))return;
   modal=null;render();
   if(action==='inspectplay'&&!isTargetedCard(c))playCard(c.uid);
   else setTargetMode(c.uid);
   return;
 }
 v108Act(action);
};
document.addEventListener('click',e=>{
 let nav=e.target.closest('[data-hand-scroll]');
 if(nav){e.preventDefault();const row=document.querySelector('.hand-wrap');if(!row)return;
   const width=row.querySelector('.card')?.getBoundingClientRect().width||100;
   row.scrollBy({left:Number(nav.dataset.handScroll)*(width*2+14),behavior:'smooth'});
   return;
 }
 let item=e.target.closest('[data-inspect-hand]');
 if(item){e.preventDefault();let uid=item.dataset.inspectHand;
   if(S?.hand?.some(c=>c.uid===uid)){modal={type:'cardinspect',id:uid,from:'handall'};render()}
 }
},true);
document.addEventListener('scroll',e=>{if(e.target?.matches?.('.hand-wrap'))v108HandScroll=e.target.scrollLeft},true);
/* V1.09 — single-source, target-aware live card damage display.
  Damage is projected through the same dmgCard() routine as actual hits.
  HP totals are shown separately because Block is not a damage modifier.
  Does not change the battle mechanics or persisted save format. */
function damagePreview(c,e){
 if(!S||S.screen!=='battle'||!c||spec(c).type!=='Attack'||!e||e.hp<=0)return null;
 const d=spec(c),key=c.key;
 const chosen=targetEnemy(), selectedIsSentinel=chosen?.id===e.id && chosen?.key==='sentinel';
 let base=(d.dmg||0)+(c.bonus||0),hits=1,random=false,aoe=!!d.aoe;
 switch(key){
  case 'body':base=S.block||0;break;
  case 'perfect':base=6+(c.up?3:2)*[...S.draw,...S.hand,...S.discard,...S.exhaust].filter(x=>CARDS[x.key]?.name.includes('Strike')).length;break;
  case 'ashen':base=6+(c.up?4:3)*S.exhaust.length;break;
  case 'bully':base=4+(c.up?3:2)*(e.vulnerable||0);break;
  case 'pactsend':base=S.exhaust.length>=3?(d.dmg||18):0;aoe=true;break;
  case 'rampage':base=10+(c.bonus||0);break;
  case 'spite':hits=(S.turnHpLoss||0)>0?(c.up?3:2):1;break;
  case 'tear':hits=1+(S.lossCount||0);break;
  case 'thrash':base=(d.dmg||4)+(c.bonus||0);hits=2;break;
  case 'fiend':hits=Math.max(0,S.hand.length-1);break;
  case 'whirlwind':hits=Math.max(0,S.energy||0);aoe=true;break;
  case 'conflag':hits=c.up?5:4;aoe=true;break;
  case 'swordboom':hits=c.up?4:3;random=true;break;
  case 'stomp':case 'breakthrough':case 'howl':case 'thunder':aoe=true;break;
  case 'dismantle':hits=e.vulnerable>0?2:1;break;
  case 'twin':case 'fightme':hits=2;break;
 }
 // The engine applies Pain and self-inflicted HP loss before the attack.
 // Rupture thus changes the very attack that activated it.
 const pain=(S.hand||[]).filter(x=>x.key==='pain'&&x.uid!==c.uid).length;
 const selfLoss=({hemo:2,bloodwall:2,bloodlet:3,breakthrough:1,brand:1,offering:6})[key]||0;
 const expectedTriggers=(pain>0?pain:0)+(selfLoss?1:0);
 if(key==='spite'&&((S.turnHpLoss||0)>0||expectedTriggers>0))hits=c.up?3:2;
 if(key==='tear')hits=1+(S.lossCount||0)+expectedTriggers;
 const strength=(S.strength||0)+((S.powers?.rupture||0)*expectedTriggers);
 // An enemy's slow debuff increments once when a played card is aimed at it,
 // before damage is computed. Include this extra stack in the preview.
 const projectedEnemy=selectedIsSentinel?{...e,slow:(e.slow||0)+1}:e;
 // dmgCard's optional third argument is added in V1.09, default unchanged.
 const perHit=dmgCard(projectedEnemy,base,strength);
 const total=perHit*hits;
 const block=Math.max(0,e.block||0);
 const postBlock=Math.max(0,total-block);
 const hpLoss=Math.min(Math.max(0,e.hp||0),postBlock);
 const repeat=!!(S.oneTwo>0);
 const conditional=!!(S.powers?.inferno&&(pain+selfLoss)>0)||repeat||random;
 let accessible=`${d.name}${c.up?'+':''}: ${perHit} damage per hit`;
 if(hits!==1)accessible+=`, ${hits} hits, ${total} total attack damage`;
 accessible+=` against ${e.name}, ${hpLoss} HP after ${block} Block and current HP`;
 if(random)accessible+='; random enemy targets, damage only if this enemy is hit';
 if(repeat)accessible+='; One-Two Punch causes an extra play, which may change the final total';
 if(S.powers?.inferno&&(pain+selfLoss)>0)accessible+='; HP-loss Power may affect the target first';
 return {perHit,hits,total,postBlock,hpLoss,enemyName:e.name,enemyId:e.id,block,base,strength,random,aoe,repeat,conditional,accessible};
}
function liveCardDescription(desc,preview){
 if(!preview)return escapeHTML(desc);
 const raw=String(desc),piece=`<strong class="v109-live-figure">${preview.perHit}</strong>`;
 let safe=escapeHTML(raw);
 // Keep permanent card definitions unchanged; substitute only the first
 // actual attack number, not Block, Energy, self-damage, or power text.
 if(/\bDeal \d+ damage/i.test(raw))safe=safe.replace(/\b(Deal\s+)\d+(\s+damage)/i,(_,start,end)=>start+piece+end);
 else if(/\bDeal damage equal to your Block/i.test(raw))safe=safe.replace(/\bDeal damage equal to your Block/i,`Deal ${piece} damage (from Block)`);
 if(preview.hits>1 && !/\b(times|twice|hits)/i.test(raw))safe+=` <span class="v109-live-sub">(${preview.hits} hits)</span>`;
 return safe;
}
function damageBreakdownHTML(c){
 if(!S||S.screen!=='battle'||spec(c).type!=='Attack')return '';
 const enemies=alive(),selected=targetEnemy();
 const previews=enemies.map(e=>damagePreview(c,e)).filter(Boolean);
 const current=previews.find(p=>p.enemyId===selected?.id)||previews[0];
 if(!current)return '';
 const targets=previews.map(p=>`<button type="button" class="v109-foe-option ${p.enemyId===selected?.id?'active':''}" data-preview-target="${p.enemyId}" aria-pressed="${p.enemyId===selected?.id}"><span>${escapeHTML(p.enemyName)}</span><b>${p.perHit}${p.hits>1?' × '+p.hits:''}</b><small>${p.hpLoss} HP after Block</small></button>`).join('');
 const modifiers=[S.strength>0?`+${S.strength} Strength`:S.strength<0?`${S.strength} Strength`:'',S.weak>0?'Weak ×0.75':'',S.shrink?'Shrink ×0.7':'',selected?.vulnerable>0?`Vulnerable ×${S.powers?.cruelty?(S.crueltyBonus||1.75):1.5}`:'',selected?.key==='sentinel'?'Slow on play':''].filter(Boolean);
 return `<div class="v109-breakdown" aria-live="polite"><div class="v109-breakdown-head">LIVE DAMAGE · ${escapeHTML(current.enemyName)}</div><div class="v109-big-number">⚔ ${current.perHit}${current.hits>1?` <span>× ${current.hits}</span>`:''}</div><div class="v109-totals"><span><b>${current.total}</b> attack damage</span><span><b>${current.block}</b> enemy Block</span><span><b>${current.hpLoss}</b> HP damage</span></div>${modifiers.length?`<p class="v109-modifiers">${escapeHTML(modifiers.join(' · '))}</p>`:''}${previews.length>1?`<p class="small">Tap a foe to compare damage before playing:</p><div class="v109-targets">${targets}</div>`:''}${current.random?'<p class="note">Random hits are not guaranteed to strike the selected enemy.</p>':''}${current.conditional?'<p class="note">Other automatic effects or repeat plays can change the final total.</p>':''}</div>`;
}
// Clicking a foe in the inspection modal changes the same selected target
// used by tap-to-target and dragging, with no damage dealt until card play.
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-preview-target]');
 if(!b||modal?.type!=='cardinspect'||S?.screen!=='battle')return;
 e.preventDefault();e.stopImmediatePropagation();
 const id=Number(b.dataset.previewTarget);
 const i=S.enemies.findIndex(q=>q.id===id&&q.hp>0);
 if(i<0)return;
 S.target=i;save();render();
},true);
// When a dragged card hovers a different foe, show damage against THAT foe
// on the ghost itself, even though selection changes only after a valid drop.
document.addEventListener('pointermove',e=>{
 if(!cardPointer?.dragging||!dragGhost||S?.screen!=='battle')return;
 const id=cardPointer.id,c=S.hand.find(q=>q.uid===id);
 const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-enemy]');
 const enemy=hit?S.enemies.find(q=>q.id===Number(hit.dataset.enemy)&&q.hp>0):null;
 if(!c||!enemy||spec(c).type!=='Attack')return;
 const p=damagePreview(c,enemy),badge=dragGhost.querySelector('.v109-damage');
 if(!p||!badge)return;
 badge.innerHTML=`<b>⚔ ${p.perHit}</b>${p.hits>1?`<em>×${p.hits}</em>`:''}<small>${p.hpLoss!==p.total?`${p.hpLoss} HP`:'LIVE'}</small>`;
 badge.title=p.accessible;
},false);

// Refresh one time for new hand toolbar on an already-loaded local save.
render();

</script></body></html>
